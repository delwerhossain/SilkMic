name: Release

# Push a tag like v1.0.0 to publish a GitHub Release with SilkMic-<version>.dmg.
# Run it by hand (Actions → Release → Run workflow) to get a test DMG as a build artifact
# without publishing anything.
#
# No Apple Developer ID yet: the app is ad-hoc signed, so macOS asks people to confirm the first
# launch (steps are in the release notes and README).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -m1 'MARKETING_VERSION' SilkMic.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        run: scripts/build-dmg.sh "$VERSION"

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SilkMic-${{ env.VERSION }}
          path: |
            build/SilkMic-${{ env.VERSION }}.dmg
            build/SilkMic-${{ env.VERSION }}.dmg.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/v${VERSION}.md"
          [[ -f "$NOTES" ]] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" \
            "build/SilkMic-${VERSION}.dmg" \
            "build/SilkMic-${VERSION}.dmg.sha256" \
            --title "SilkMic ${VERSION}" \
            --notes-file "$NOTES"
