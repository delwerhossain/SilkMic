name: Release

# Push a tag like v1.0.0 to publish a GitHub Release with SilkMic-<version>.dmg.
# Run it by hand (Actions → Release → Run workflow) to get a test DMG as a build artifact
# without publishing anything.
#
# No Apple Developer ID yet: the app is ad-hoc signed, so macOS asks people to confirm the first
# launch (steps are in the release notes and README).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_P12_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep -m1 'MARKETING_VERSION' SilkMic.xcodeproj/project.pbxproj | sed 's/.*= \(.*\);/\1/')" >> "$GITHUB_ENV"
          fi

      - name: Install dmgbuild
        run: pipx install dmgbuild || python3 -m pip install --user --break-system-packages dmgbuild

      # Optional: the "SilkMic Self-Signed" certificate (secrets SIGNING_P12_BASE64 and
      # SIGNING_P12_PASSWORD). With it, macOS keeps people's permissions across updates.
      - name: Import signing certificate
        env:
          P12: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        if: env.HAS_SIGNING_CERT == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$P12_PASSWORD" -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"

      - name: Build DMG
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          scripts/build-dmg.sh "$VERSION"

      - name: Upload test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SilkMic-${{ env.VERSION }}
          path: |
            build/SilkMic-${{ env.VERSION }}.dmg
            build/SilkMic-${{ env.VERSION }}.dmg.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="docs/releases/v${VERSION}.md"
          [[ -f "$NOTES" ]] || NOTES=/dev/null
          gh release create "$GITHUB_REF_NAME" \
            "build/SilkMic-${VERSION}.dmg" \
            "build/SilkMic-${VERSION}.dmg.sha256" \
            --title "SilkMic ${VERSION}" \
            --notes-file "$NOTES"
